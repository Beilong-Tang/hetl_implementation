[project]
name = "nsl-kdd-hetl-reproduction"
version = "0.1.0"
description = "Reproduction of Feature-Based Transfer Learning for Network Security"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "seaborn>=0.13",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
